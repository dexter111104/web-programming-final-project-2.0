<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Pollution Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 啟動畫面 -->
    <div id="splash">
        <div class="splash-content">
            <div class="splash-logo">
                <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="36" cy="36" r="10" fill="#00FF41"/>
                    <circle cx="36" cy="36" r="10" fill="#00FF41" opacity="0.3">
                        <animate attributeName="r" values="10;22;10" dur="2s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <line x1="36" y1="4" x2="36" y2="16" stroke="#00FF41" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="36" y1="56" x2="36" y2="68" stroke="#00FF41" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="4" y1="36" x2="16" y2="36" stroke="#00FF41" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="56" y1="36" x2="68" y2="36" stroke="#00FF41" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="11" y1="11" x2="19" y2="19" stroke="#00FF41" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    <line x1="53" y1="53" x2="61" y2="61" stroke="#00FF41" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    <line x1="61" y1="11" x2="53" y2="19" stroke="#00FF41" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    <line x1="19" y1="53" x2="11" y2="61" stroke="#00FF41" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                </svg>
            </div>
            <div class="splash-title">光害地圖</div>
            <div class="splash-sub">Light Pollution Atlas</div>
        </div>
    </div>

    <!-- 全螢幕地圖 -->
    <div id="map"></div>

    <!-- 左側位置資訊面板 -->
    <div id="loc-panel" class="loc-panel">
        <div class="loc-header">
            <span id="loc-place" class="loc-place-name">—</span>
            <button id="loc-close" class="loc-close-btn">✕</button>
        </div>
        <div id="loc-body" class="loc-body">
            <div class="loc-hint">點擊地圖上任意位置查詢光害資訊</div>
        </div>
    </div>

    <!-- 頂部標題列 -->
    <div class="top-bar">
        <div class="top-bar-title">
            <svg width="18" height="18" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle;margin-right:7px;filter:drop-shadow(0 0 4px rgba(0,255,65,0.7))">
                <circle cx="36" cy="36" r="10" fill="#00FF41"/>
                <line x1="36" y1="4" x2="36" y2="16" stroke="#00FF41" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="36" y1="56" x2="36" y2="68" stroke="#00FF41" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="4" y1="36" x2="16" y2="36" stroke="#00FF41" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="56" y1="36" x2="68" y2="36" stroke="#00FF41" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="11" y1="11" x2="19" y2="19" stroke="#00FF41" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                <line x1="53" y1="53" x2="61" y2="61" stroke="#00FF41" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                <line x1="61" y1="11" x2="53" y2="19" stroke="#00FF41" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                <line x1="19" y1="53" x2="11" y2="61" stroke="#00FF41" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
            </svg>
            光害地圖 <span class="top-bar-sub">Light Pollution Atlas</span>
        </div>
        <button id="panel-toggle" class="panel-toggle-btn">☰</button>
    </div>

    <!-- 右側浮動控制面板 -->
    <div id="control-panel" class="control-panel">

        <!-- 底圖選擇 -->
        <div class="section-block">
            <div class="section-label">底圖選擇</div>
            <div class="layer-btns">
                <button class="layer-btn active" data-layer="street">街道</button>
                <button class="layer-btn" data-layer="satellite">衛星</button>
            </div>
        </div>

        <!-- 光害疊加圖層控制 -->
        <div class="section-block">
            <div class="toggle-wrapper">
                <span class="toggle-label">顯示光害疊加圖層</span>
                <label class="switch">
                    <input type="checkbox" id="lpToggle" checked>
                    <span class="slider-round"></span>
                </label>
            </div>
        </div>

        <!-- 生態衝擊 -->
        <div class="section-block">
            <div class="section-label">生態衝擊追蹤 (SDG 15)</div>
            <div class="eco-tags">
                <button class="eco-btn" onclick="showEcoDetail('birds')">候鳥遷徙</button>
                <button class="eco-btn" onclick="showEcoDetail('insects')">昆蟲生態</button>
                <button class="eco-btn" onclick="showEcoDetail('human')">人類健康</button>
            </div>
            <div id="eco-detail-box" class="eco-detail-box">
                點擊上方按鈕了解光害影響...
            </div>
        </div>

        <!-- 永續方案 -->
        <div class="section-block solution-section">
            <div class="section-label">永續照明方案 (SDG 11)</div>
            <div class="sol-item"><h4>① 定向遮光</h4><p>使用屏蔽式燈具減少光線向上散逸。</p></div>
            <div class="sol-item"><h4>② 暖色溫管理</h4><p>採用 3000K 以下暖色光，減少有害藍光。</p></div>
            <div class="sol-item"><h4>③ 智慧感測</h4><p>離峰時段自動降壓調光，達成節能目標。</p></div>
        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
